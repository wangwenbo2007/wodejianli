<style>
  html { scroll-behavior: smooth; }
  body { background: #000; overflow-x: hidden; -webkit-font-smoothing: antialiased; }

  /* ===== 流光体背景（数字雨 + 流动光晕） ===== */
  #rainCanvas {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none; opacity: 0;
    transition: opacity 1s cubic-bezier(.22,1,.36,1);
  }
  body.is-detail #rainCanvas { opacity: .55; }
  #bgAura { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity 1.1s cubic-bezier(.22,1,.36,1); }
  body.is-detail #bgAura { opacity: 1; }
  .aura { position: absolute; border-radius: 50%; filter: blur(140px); }
  .aura-1 { width: 620px; height: 620px; left: -14%; top: -12%; background: radial-gradient(circle, rgba(0,229,160,.30), transparent 68%); animation: drift1 22s ease-in-out infinite; }
  .aura-2 { width: 560px; height: 560px; right: -16%; bottom: -14%; background: radial-gradient(circle, rgba(34,211,238,.26), transparent 68%); animation: drift2 27s ease-in-out infinite; }
  .aura-3 { width: 460px; height: 460px; left: 42%; top: 38%; background: radial-gradient(circle, rgba(99,102,241,.22), transparent 70%); animation: drift3 31s ease-in-out infinite; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,50px) scale(1.14); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1.06); } 50% { transform: translate(-80px,-46px) scale(1); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-56px,64px) scale(1.2); } }
  #bgVeil { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(130% 90% at 50% 0%, transparent 30%, rgba(0,0,0,.72) 100%); }

  /* ===== 描边大编号（参考图一） ===== */
  .num-outline {
    color: transparent;
    -webkit-text-stroke: 1.6px rgba(255,255,255,.88);
    font-weight: 800; letter-spacing: .01em; line-height: .9;
    transition: -webkit-text-stroke-color .45s ease, transform .45s cubic-bezier(.22,1,.36,1);
  }
  @media (min-width: 640px) { .num-outline { -webkit-text-stroke-width: 2px; } }

  /* ===== 作品卡（参考图一） ===== */
  .work-card {
    display: block; position: relative; overflow: hidden;
    background: #0a0a0a; border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px; padding: 26px 22px 22px;
    transition: border-color .45s ease, background .45s ease, transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s ease;
  }
  @media (min-width: 640px) { .work-card { padding: 34px 34px 28px; border-radius: 22px; } }
  .work-card::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    opacity: 0; transition: opacity .5s ease;
    background: radial-gradient(520px 260px at 18% 0%, rgba(0,229,160,.10), transparent 62%);
  }
  .work-card:hover { border-color: rgba(0,229,160,.42); background: #0c0f0e; transform: translateY(-4px); box-shadow: 0 24px 60px -28px rgba(0,229,160,.42); }
  .work-card:hover::after { opacity: 1; }
  .work-card:hover .num-outline { -webkit-text-stroke-color: #00e5a0; transform: translateY(-2px); }
  .work-card:hover .card-arrow { opacity: 1; transform: translate(0,0); }
  .card-arrow { opacity: 0; transform: translate(-8px, 8px); transition: all .45s cubic-bezier(.22,1,.36,1); }
  .card-rule { height: 1px; background: rgba(255,255,255,.10); }
  .work-card:hover .card-rule { background: rgba(0,229,160,.28); }

  .tag-chip {
    display: inline-flex; align-items: center;
    font-size: .7rem; font-weight: 700; letter-spacing: .06em;
    padding: .3rem .62rem; border-radius: 999px;
    background: rgba(0,229,160,.08); border: 1px solid rgba(0,229,160,.24); color: #5eead4;
  }
  .label-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ===== 页面切换 ===== */
  .view { position: relative; z-index: 2; }
  [hidden] { display: none !important; }
  .fade-in { animation: fadeIn .62s cubic-bezier(.22,1,.36,1) both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .stagger > * { animation: fadeIn .7s cubic-bezier(.22,1,.36,1) both; }
  .stagger > *:nth-child(1) { animation-delay: .04s; }
  .stagger > *:nth-child(2) { animation-delay: .12s; }
  .stagger > *:nth-child(3) { animation-delay: .20s; }
  .stagger > *:nth-child(4) { animation-delay: .28s; }
  .stagger > *:nth-child(5) { animation-delay: .36s; }
  .stagger > *:nth-child(6) { animation-delay: .44s; }

  /* ===== 图片框 ===== */
  .shot { border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.12); background: #0b0b0b; box-shadow: 0 30px 80px -40px rgba(0,0,0,.9); }
  .shot img { display: block; width: 100%; height: auto; }

  /* ===== 背景音乐开关 ===== */
  #bgmBtn {
    position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    z-index: 40; display: grid; place-items: center;
    width: 52px; height: 52px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(0,0,0,.62);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    color: #94a3b8; cursor: pointer;
    transition: border-color .35s ease, color .35s ease, transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease;
  }
  @media (min-width: 640px) { #bgmBtn { right: 1.5rem; bottom: 1.5rem; width: 56px; height: 56px; } }
  #bgmBtn:hover { border-color: rgba(0,229,160,.55); color: #00e5a0; transform: translateY(-2px); box-shadow: 0 18px 40px -18px rgba(0,229,160,.55); }
  #bgmBtn[data-on="1"] { border-color: rgba(0,229,160,.5); color: #00e5a0; }
  .eq { display: none; align-items: flex-end; gap: 2.5px; height: 16px; }
  #bgmBtn[data-on="1"] .eq { display: flex; }
  #bgmBtn[data-on="1"] .eq-off { display: none; }
  .eq i { width: 2.5px; border-radius: 2px; background: currentColor; transform-origin: bottom; animation: eqBar 1.05s ease-in-out infinite; }
  .eq i:nth-child(1) { height: 45%; animation-delay: -.90s; }
  .eq i:nth-child(2) { height: 100%; animation-delay: -.55s; }
  .eq i:nth-child(3) { height: 65%; animation-delay: -.20s; }
  .eq i:nth-child(4) { height: 85%; animation-delay: -.75s; }
  @keyframes eqBar { 0%, 100% { transform: scaleY(.32); } 50% { transform: scaleY(1); } }
  #bgmHint {
    position: fixed; right: 1rem; bottom: calc(4.6rem + env(safe-area-inset-bottom, 0px));
    z-index: 40; max-width: 200px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.78);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 12px; padding: .5rem .7rem; font-size: .7rem; line-height: 1.45; color: #cbd5e1;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .4s ease, transform .4s cubic-bezier(.22,1,.36,1);
  }
  #bgmHint.show { opacity: 1; transform: none; }
  @media (min-width: 640px) { #bgmHint { right: 1.5rem; bottom: 5.2rem; } }

  ::selection { background: #00e5a0; color: #04120c; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>

<script>
/* ============ 作品数据（文字为本人原文，未改写） ============ */
const WORKS = [
  {
    id: 'w1',
    num: '01',
    titleEn: 'Video Script Extractor',
    label: 'COZE AUTOMATION LAB // 2026',
    caption: '在 Coze 平台上搭建的高效视频文案提取流。',
    desc: '支持多平台视频 URL 一键输入，精准提取音频并转化为结构化文案，极大提升内容创作效率。',

  },

    tags: ['Dify', '飞书机器人', '自动化', 'Webhook'],
    cover: 'works/w2-1.jpg',
    coverCap: 'Dify 工作流画布与 HTTP 请求节点配置',
    gallery: [
      { src: 'works/w2-2.jpg', cap: '飞书机器人推送的 AI 资讯早报，每条都带引用源', size: 'half' },
      { src: 'works/w2-3.jpg', cap: '完整链路：工作流编排 + 结构化输出', size: 'half' }
    ]
  },
  {
    id: 'w3',
    num: '03',
    titleEn: 'Agentic Dev Workflow',
    label: 'INTELLIGENT DEVELOPMENT LAB // 2026',
    caption: '深度掌握 Claude Code、Cursor 等 Agent。',
    desc: '作为 Aion UI 项目的核心实践者，致力于通过图形化界面整合多款 AI 智能体，实现了一站式 AI 编程 environment，将传统编码中的模板编写时间从小时级缩短至秒级。',
    tags: ['Claude Code', 'Aion UI', 'MCP', 'Agent Skill'],
    cover: 'works/w3-2.jpg',
    coverCap: '多智能体图形化控制台：在统一界面里调度 Agent 与会话',
    gallery: [
      { src: 'works/w3-1.jpg', cap: 'Claude Code CLI：终端内的 Agent 与会话管理', size: 'full' },
      { src: 'works/w3-3.jpg', cap: '飞书机器人回传的任务完成报告', size: 'narrow' }
    ]
  },
  {

    titleEn: 'Dynamic Visual Website',

    desc: '',
    tags: ['Gemini'],
    cover: 'works/w4-1.jpg',
    coverCap: 'Cursor + Claude Code 协作，从零初始化并搭建前端工程',
    gallery: []
  },

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ============ 渲染列表 ============ */
function renderList() {
  $('#workList').innerHTML = WORKS.map(w => `
    <a class="work-card" href="#${w.id}" data-work="${w.id}">
      <span class="num-outline pointer-events-none block text-[3.4rem] sm:text-[4.25rem]">${w.num}</span>
      <h2 class="mt-1 text-[1.6rem] font-extrabold uppercase leading-[1.06] tracking-tight text-white sm:text-[2.1rem]">${w.titleEn}</h2>
      <p class="mt-3 text-sm leading-7 text-slate-400 sm:text-[.95rem]">${w.caption}</p>
      <div class="mt-6 flex items-end justify-between gap-4">
        <div class="min-w-0">
          <div class="flex flex-wrap gap-1.5">
            ${w.tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
          </div>
        </div>
        <span class="card-arrow shrink-0 text-emerald-400">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6"><path d="M7 17 17 7M7 7h10v10"/></svg>
        </span>
      </div>
      <div class="card-rule mt-5"></div>
    </a>
  `).join('');
}

/* ============ 渲染详情 ============ */
function renderDetail(w) {
  const i = WORKS.findIndex(x => x.id === w.id);
  const prev = WORKS[(i - 1 + WORKS.length) % WORKS.length];
  const next = WORKS[(i + 1) % WORKS.length];

  $('#dLabel').textContent = w.label;
  $('#dCover').innerHTML =
    `<img src="${w.cover}" alt="${w.coverCap}" loading="eager">
     <figcaption class="border-t border-white/10 bg-black/50 px-4 py-3 text-xs leading-6 text-slate-400 sm:px-5 sm:text-sm">
       <span class="label-mono mr-2 text-[10px] font-bold text-emerald-400/80">01</span>${w.coverCap}
       ${w.gallery.length ? `<span class="label-mono ml-2 text-[10px] tracking-widest text-slate-500">/ ${String(w.gallery.length + 1).padStart(2, '0')}</span>` : ''}
     </figcaption>`;
  $('#dCaption').textContent = w.caption;
  $('#dTitle').textContent = w.titleEn;
  const d = $('#dDesc');
  d.textContent = w.desc || '';
  d.hidden = !w.desc;
  $('#dTags').innerHTML = w.tags.map(t => `<span class="tag-chip">${t}</span>`).join('');

  /* 按图片比例分配版位：横图满宽、方图并排、竖屏收窄居中，避免竖长图撑高页面 */
  const SHOT_CLS = {
    full: 'sm:col-span-2',
    half: 'sm:col-span-1',
    narrow: 'sm:col-span-2 mx-auto w-full max-w-[320px]'
  };
  $('#dGallery').innerHTML = w.gallery.map((g, k) => `
    <figure class="shot ${SHOT_CLS[g.size] || SHOT_CLS.full}">
      <img src="${g.src}" alt="${g.cap}" loading="lazy">
      <figcaption class="border-t border-white/10 bg-black/50 px-4 py-3 text-xs leading-6 text-slate-400 sm:px-5 sm:text-sm">
        <span class="label-mono mr-2 text-[10px] font-bold text-emerald-400/80">0${k + 2}</span>${g.cap}
      </figcaption>
    </figure>
  `).join('');

  $('#dPrev').href = '#' + prev.id; $('#dPrevT').textContent = prev.titleEn;
  $('#dNext').href = '#' + next.id; $('#dNextT').textContent = next.titleEn;
  $('#backBtn').href = '#';
}

/* ============ 路由 ============ */
function route() {
  const id = location.hash.replace(/^#\/?/, '');
  const w = WORKS.find(x => x.id === id);
  const list = $('#listView'), detail = $('#detailView');

  if (w) {
    renderDetail(w);
    list.hidden = true; detail.hidden = false;
    detail.classList.remove('fade-in'); void detail.offsetWidth; detail.classList.add('fade-in');
    document.body.classList.add('is-detail');
    document.title = w.titleEn + ' · 作品库 · 王文博';
    rainActive = true;
  } else {
    detail.hidden = true; list.hidden = false;
    document.body.classList.remove('is-detail');
    document.title = '作品库 · 王文博';
    rainActive = false;
  }
  window.scrollTo(0, 0);
}

/* ============ 流光体：数字雨 ============ */
let rainActive = false;
(function initRain() {
  const cv = $('#rainCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  if (!ctx) { cv.style.display = 'none'; return; }
  const CHARS = '0101011010';
  let w = 0, h = 0, fs = 16, cols = 0, drops = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const vw = window.innerWidth, vh = window.innerHeight;
    cv.width = Math.floor(vw * dpr); cv.height = Math.floor(vh * dpr);
    cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
    fs = (vw < 640 ? 13 : 16) * dpr;
    cols = Math.ceil(cv.width / fs);
    drops = new Array(cols).fill(0).map(() => Math.random() * -120);
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  }
  resize();
  window.addEventListener('resize', resize);

  let last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!rainActive || document.hidden) return;
    if (now - last < 62) return;
    last = now;
    ctx.fillStyle = 'rgba(0,0,0,.085)';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.font = fs + 'px ui-monospace, monospace';
    for (let i = 0; i < cols; i++) {
      const ch = CHARS[(Math.random() * CHARS.length) | 0];
      const x = i * fs, y = drops[i] * fs;
      ctx.fillStyle = Math.random() > 0.972 ? 'rgba(200,255,235,.95)' : 'rgba(0,229,160,.52)';
      ctx.fillText(ch, x, y);
      if (y > cv.height && Math.random() > 0.974) drops[i] = 0;
      drops[i]++;
    }
  }
  requestAnimationFrame(frame);
})();

/* ============ 背景音乐《深海之息》 ============ */
(function initBgm() {
  const a = $('#bgm'), btn = $('#bgmBtn'), hint = $('#bgmHint');
  if (!a || !btn) return;
  const target = 0.45;
  let faded = false, userPaused = false, hintTimer;

  function paint(on) {
    btn.dataset.on = on ? '1' : '0';
    const label = on ? '暂停背景音乐' : '播放背景音乐';
    btn.setAttribute('aria-label', label); btn.title = label;
  }
  function fadeUp() {
    if (faded) return;
    faded = true;
    a.volume = 0;
    const t0 = performance.now();
    (function step(now) {
      /* rAF 时间戳与 performance.now() 时钟源不同，偶发早 0.5ms，必须钳位到 [0,1] */
      const p = Math.min(1, Math.max(0, (now - t0) / 1500));
      a.volume = Math.min(1, Math.max(0, target * p));
      if (p < 1 && !a.paused) requestAnimationFrame(step);
    })(t0);
  }
  function attempt() {
    if (userPaused) return;
    a.volume = faded ? target : 0;
    a.play().then(() => { paint(true); fadeUp(); hideHint(); }).catch(() => paint(false));
  }
  function showHint() {
    if (!hint) return;
    hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.remove('show'), 6000);
  }
  function hideHint() { if (hint) hint.classList.remove('show'); }

  /* 进入作品库即尝试播放 */
  attempt();
  /* 浏览器拦截时，首次任意交互即补播 */
  const unlock = () => { if (a.paused && !userPaused) attempt(); };
  ['pointerdown', 'touchstart', 'keydown', 'wheel', 'scroll'].forEach(ev =>
    window.addEventListener(ev, unlock, { passive: true }));
  setTimeout(() => { if (a.paused) showHint(); }, 1200);

  btn.addEventListener('click', () => {
    if (a.paused) { userPaused = false; attempt(); }
    else { userPaused = true; a.pause(); paint(false); hideHint(); }
  });
})();

/* ============ 启动 ============ */
$('#year').textContent = new Date().getFullYear();
renderList();
window.addEventListener('hashchange', route);
route();
</script>
